<details><summary>👤 Qui est « à risque infectieux augmenté » ?</summary><ul><li>Chimiothérapie aplasiante</li><li>Immunosuppresseur / immunomodulateur / biothérapie (au cas par cas, avec le prescripteur)</li><li>Corticoïdes ≥ 10 mg/j éq. prednisolone depuis > 2 semaines</li><li>Traitement anti-rejet (greffe d'organe, allogreffe de CSH)</li><li>VIH avec CD4 < 200/mm³ · neutropénie < 500/mm³</li><li>Déficit immunitaire congénital ou du complément</li><li>Asplénie depuis < 5 ans</li><li>Diabète avec HbA1c ≥ 9 % (orienter vers le médecin sans surseoir au geste)</li><li>Insuffisance rénale sévère (DFG < 30) ou dialyse</li><li>Insuffisance hépatocellulaire sévère (TP ≤ 50 %)</li><li>Syndrome drépanocytaire majeur (à évaluer avec le référent)</li></ul></details>
<details><summary>🦴 Qui est « à haut risque d'ONM » ?</summary><ul><li>Radiothérapie cervico-faciale ≥ 40 Gy sur les mâchoires</li><li>Dénosumab (ou biosimilaire), dernière injection < 6 mois</li><li>Bisphosphonates (per os ou IV) pour pathologie maligne</li><li>Anti-angiogéniques pour pathologie maligne</li><li>Bisphosphonates pour pathologie bénigne ≥ 5 ans cumulés</li></ul><p class="small">Population générale = rémission de cancer, prothèse articulaire, allogreffe sans anti-rejet, dénutrition, tabac, diabète HbA1c < 9 %, obésité, grossesse, âge, bisphosphonates bénins < 5 ans, dénosumab > 6 mois, RT < 40 Gy.</p></details>
<details><summary>❤️ Qui est « à haut risque d'endocardite » ?</summary><ul><li>Antécédent d'endocardite infectieuse</li><li>Prothèse valvulaire ou matériel de réparation valvulaire, posé chirurgicalement ou par voie percutanée (TAVI, clip…)</li><li>Cardiopathie congénitale cyanogène complexe (ventricule unique, Eisenmenger…)</li><li>Cardiopathie congénitale complexe traitée par matériel prothétique : jusqu'à 6 mois après, ou à vie si shunt résiduel</li><li>Pompe d'assistance ventriculaire</li></ul><p class="small"><b>Risque intermédiaire</b> (pas d'AP, pas de CI) : valvulopathie (anomalie, fuite, rétrécissement), cardiomyopathie hypertrophique obstructive, autre cardiopathie congénitale, stimulateur avec sonde intracardiaque. En cas de doute sur la cardiopathie, contacter le cardiologue ou le médecin traitant.</p><p class="small"><b>Suivi</b> : contrôle bucco-dentaire au moins semestriel ; OPT en début de prise en charge. Sous AVK : soins possibles sans arrêt, INR < 4 contrôlé dans les 24 h (sauf gestes à haut risque hémorragique). Piercings contre-indiqués. Avant chirurgie valvulaire programmée : éradiquer les foyers ≥ 15 jours avant ; en urgence (72 h), aucun soin dentaire ne doit retarder le geste.</p></details>
<details><summary>📌 Règles générales</summary><ul><li>Bain de bouche CHX 0,12 % ou povidone iodée 10 % avant chaque geste.</li><li><b>Haut risque d'endocardite</b> : choisir le profil dédié (reco HAS 2024). Risque intermédiaire : ni contre-indication ni AP spécifique. Bain de bouche CHX 0,12 ou 0,20 % pendant 1 min avant tout geste (haut risque et intermédiaire).</li><li>Oubli ou acte en urgence : la prophylaxie peut être prise jusqu'à 2 h après le geste.</li><li>Préciser « délivrance à l'unité » sur l'ordonnance d'antibioprophylaxie.</li><li>Antibiothérapie curative toujours associée à un geste local (drainage, avulsion, pulpectomie…).</li><li>Réévaluer à J3 : poursuivre, ou passer en 2ᵉ intention si pas d'amélioration. Échec de 2ᵉ intention → avis infectiologique.</li><li>Insuffisant rénal : prise unique sans adaptation ; schémas prolongés à adapter au DFG.</li><li>Obésité : <a href="https://www.abxbmi.com" target="_blank" rel="noopener">abxbmi.com</a> · Grossesse / allaitement : <a href="https://www.lecrat.fr" target="_blank" rel="noopener">lecrat.fr</a> (amox, clarithro, azithro, métronidazole possibles à tout terme).</li><li>Antibiothérapie locale : jamais indiquée. Sous AINS : pas d'antibiotique systématique.</li><li>Hospitalisation ± IV : cellulite avec signes systémiques, ostéomyélite, ONM avec extension, observance impossible. Relais per os dès que possible.</li></ul></details>
<details><summary>💊 Contre-indications & interactions</summary><p class="small">Sous-menu à venir.</p></details>

const LV=[["R","Sans risque hémorragique"],["C","Risque hémorragique faible"],["CI","Risque hémorragique élevé"],["C","Geste déconseillé"],["CI","Geste contre-indiqué"]];

if(tt=="mono")return S("R",["Pas d'arrêt","Prise en charge en ville",lv==2?"Poursuite de la monothérapie pour tout acte, quel que soit le risque hémorragique.":""]);

<details><summary>🩹 Hémostase locale</summary><ul><li><b>Systématique</b>, quel que soit le traitement.</li><li>Hémostase conventionnelle : compression, sutures, hémostatiques résorbables (éponge collagène, gaze de cellulose) ± colle cyanoacrylate, compresse ou bain de bouche passif d'acide tranexamique 10 %.</li><li>Risque élevé, en plus : colle de fibrine (fibrinogène + thrombine), électrocoagulation mono/bipolaire, gouttière de compression.</li><li>Préférer le mini-invasif : pas de décharge verticale, décollement et ostéotomie minimes, flapless, chirurgie guidée.</li><li>Hygiène renforcée et détartrage avant tout geste, pour réduire l'inflammation gingivale.</li><li>Saignement post-op non contrôlé par compression : reprise de l'hémostase sous AL (décaillotage, révision). Saignement persistant : hospitalisation.</li></ul></details>
<details><summary>⚠️ Facteurs majorant le risque</summary><ul><li>Décollement au-delà de la ligne muco-gingivale, décollement lingual, incision de décharge verticale</li><li>Avulsion en zone inflammatoire, temps opératoire > 1 h</li><li>Zones à risque : plancher buccal, symphyse, foramen mentonnier, sinus maxillaire</li><li>Terrain : AAP associé, HTA mal contrôlée, insuffisance rénale ou hépatique, cardiopathies multiples → arrêt à discuter avec le prescripteur, même pour un geste à faible risque</li></ul></details>
<details><summary>💊 Interactions à connaître</summary><ul><li><b>AVK</b> : aspirine et AINS contre-indiqués ; antalgiques = paracétamol ± opiacés.</li><li><b>AVK + antibiotiques</b> : hausse de l'INR possible avec amoxicilline (± clavulanique), clindamycine, métronidazole, macrolides (sauf spiramycine) → prévenir le patient et contrôler l'INR dans les jours qui suivent. L'antibioprophylaxie en prise unique ne modifie pas l'INR.</li><li><b>AOD</b> : éviter la clarithromycine.</li><li>Aucun examen biologique ne prédit le risque hémorragique sous AAP ou AOD.</li></ul></details>
<details><summary>📌 Organisation</summary><ul><li>Opérer le matin et en début de semaine.</li><li>Segmenter les interventions dès que possible.</li><li>Risque hémorragique : du ressort du chirurgien. Risque thrombotique : du ressort du prescripteur.</li><li>Prise en charge en ville possible si patient coopérant et hôpital à < 50 km / < 1 h.</li><li>Continuité des soins : le patient doit pouvoir joindre un praticien ou un service d'astreinte en cas de saignement.</li><li>Gestes contre-indiqués si le plateau technique ou l'expérience sont insuffisants, et tous les gestes contre-indiqués en cas de haut risque d'endocardite associé.</li></ul></details>
<p class="small">Sources : SFAR / GIHP, RFE « Gestion des anticoagulants pour une procédure invasive programmée », chapitre « Procédures invasives en chirurgie orale » (SFCO), 2026 — classement du risque, AOD, AVK. SFCO, « Gestion péri-opératoire des patients traités par antithrombotiques en chirurgie orale », juillet 2015 — AAP, héparines, interactions, organisation. Toujours confirmer avec le prescripteur pour les gestes à risque élevé.</p>`;
